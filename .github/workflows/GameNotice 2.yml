name: GI-GameNotice System 05:00

on:
  schedule:
    - cron: "0 22 * * *"   # รันเวลา 05:00 ไทย 
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Save settings.json (รองรับ WEBHOOK ถึง WEBHOOK5)
      - name: Save settings.json
        run: |
          echo "{
            \"name\": \"${{ secrets.NAME }}\",
            \"webhooks\": [
              \"${{ secrets.WEBHOOK }}\",
              \"${{ secrets.WEBHOOK1 }}\",
              \"${{ secrets.WEBHOOK2 }}\",
              \"${{ secrets.WEBHOOK3 }}\",
              \"${{ secrets.WEBHOOK4 }}\",
              \"${{ secrets.WEBHOOK5 }}\"
            ],
            \"language\": \"${{ secrets.LANGUAGE }}\",
            \"repo\": \"${GITHUB_REPOSITORY}\"
          }" > settings.json

      # Run main script
      - name: Execute main script
        run: python3 main.py

      # Read commit message
      - name: Read commit message
        id: commit
        run: |
          if [ -f commit.txt ]; then
            COMMIT_MSG=$(<commit.txt)
            echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"
            echo "✅ Commit message loaded: $COMMIT_MSG"
          else
            echo "⚠️ No commit.txt found"
          fi

      # Commit & Push updates
      - name: Commit & Push updates
        if: env.COMMIT_MSG != ''
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add log README.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "${{ env.COMMIT_MSG }}"

          git push origin HEAD:GI-GameNotice  